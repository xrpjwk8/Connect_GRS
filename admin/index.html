<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connect GRS 관리자</title>
<style>
  :root {
    --surface: #FAF9F9;
    --white: #FFFFFF;
    --chip-bg: #F4F4F2;
    --ink: #0F0F0F;
    --ink-secondary: #3D3D3D;
    --primary: #D6FF3D;
    --primary-deep: #526600;
    --on-primary: #171E00;
    --primary-dim: #AFD500;
    --border: #ECECEC;
    --danger: #EF4444;
    --danger-soft: #FFE9E7;
    --success: #16A34A;
    --neutral: #8A8A8A;
    --radius-pill: 999px;
    --radius-lg: 16px;
    --radius-md: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    font-size: 14px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 800; }
  header .spacer { flex: 1; }
  header input {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--ink);
    min-width: 220px;
  }
  .status-dot { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--chip-bg); color: var(--ink-secondary); }
  .status-dot.ok { background: rgba(22,163,74,0.12); color: var(--success); }
  .status-dot.err { background: var(--danger-soft); color: var(--danger); }

  main { max-width: 1180px; margin: 0 auto; padding: 24px; }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .stat-tile { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .stat-tile .value { font-size: 22px; font-weight: 800; }
  .stat-tile .label { font-size: 12px; color: var(--ink-secondary); margin-top: 2px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn {
    padding: 9px 18px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--ink-secondary);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input, .toolbar select {
    padding: 8px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--white);
    font-size: 13px;
  }
  .toolbar input { min-width: 220px; }
  .toolbar .count { color: var(--ink-secondary); font-size: 12px; margin-left: auto; }

  .table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 12px;
    color: var(--ink-secondary);
    background: var(--chip-bg);
    padding: 10px 14px;
    white-space: nowrap;
    font-weight: 700;
  }
  tbody td { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  tbody tr:hover { background: rgba(0,0,0,0.015); }
  .muted { color: var(--neutral); }
  .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: var(--neutral); }

  .badge { display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 700; }
  .badge.PENDING { background: var(--chip-bg); color: var(--ink); }
  .badge.CONFIRMED { background: rgba(82,102,0,0.1); color: var(--primary-deep); }
  .badge.COMPLETED { background: var(--chip-bg); color: var(--ink-secondary); }
  .badge.CANCELLED, .badge.REJECTED { background: var(--danger-soft); color: var(--danger); }

  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--white);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink);
  }
  .btn:hover { border-color: var(--ink-secondary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn.danger { background: var(--white); border-color: var(--danger); color: var(--danger); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .empty { padding: 40px; text-align: center; color: var(--neutral); }
  footer { text-align: center; color: var(--neutral); font-size: 12px; padding: 24px; }
</style>
</head>
<body>

<header>
  <h1>Connect GRS 관리자</h1>
  <span class="spacer"></span>
  <input id="baseUrl" value="http://localhost:8080" />
  <span id="healthStatus" class="status-dot">연결 확인 중...</span>
  <button class="btn" onclick="refreshAll()">전체 새로고침</button>
</header>

<main>
  <div id="statsRow" class="stats-row"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="reservations" onclick="switchTab('reservations')">예약</button>
    <button class="tab-btn" data-tab="stores" onclick="switchTab('stores')">매장</button>
    <button class="tab-btn" data-tab="owners" onclick="switchTab('owners')">점주</button>
    <button class="tab-btn" data-tab="bookers" onclick="switchTab('bookers')">예약자</button>
  </div>

  <div class="toolbar">
    <input id="searchInput" placeholder="검색 (이름, 이메일, 매장명 등)" oninput="renderCurrentTab()" />
    <select id="statusFilter" onchange="loadReservations()" style="display:none">
      <option value="">전체 상태</option>
      <option value="pending">대기중</option>
      <option value="confirmed">확정</option>
      <option value="completed">완료</option>
      <option value="cancelled">취소</option>
      <option value="rejected">거절</option>
    </select>
    <span class="count" id="rowCount"></span>
  </div>

  <div class="table-wrap">
    <div id="tableHost"></div>
  </div>
</main>

<footer>Connect GRS 내부 운영 도구 · 별도 로그인 없이 백엔드에 직접 연결됩니다.</footer>

<script>
const state = { tab: 'reservations', stores: [], owners: [], bookers: [], reservations: [] };

function base() { return document.getElementById('baseUrl').value.replace(/\/$/, ''); }

async function api(method, path, body) {
  const res = await fetch(base() + path, {
    method,
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  if (!res.ok) throw new Error((data && data.message) || `HTTP ${res.status}`);
  return data;
}

async function checkHealth() {
  const el = document.getElementById('healthStatus');
  el.textContent = '연결 확인 중...'; el.className = 'status-dot';
  try {
    await api('GET', '/api/meta/filters');
    el.textContent = '백엔드 연결됨'; el.className = 'status-dot ok';
  } catch (e) {
    el.textContent = '연결 실패: ' + e.message; el.className = 'status-dot err';
  }
}

async function loadStats() {
  try {
    const s = await api('GET', '/api/admin/stats');
    const tiles = [
      ['매장', s.storeCount], ['점주', s.ownerCount], ['예약자', s.bookerCount],
      ['전체 예약', s.reservationCount], ['대기중', s.pendingCount], ['확정', s.confirmedCount],
      ['푸시 등록 기기', s.registeredDeviceCount],
    ];
    document.getElementById('statsRow').innerHTML = tiles.map(([label, value]) =>
      `<div class="stat-tile"><div class="value">${value}</div><div class="label">${label}</div></div>`
    ).join('');
  } catch (e) {
    document.getElementById('statsRow').innerHTML = `<div class="empty">통계를 불러오지 못했어요: ${e.message}</div>`;
  }
}

function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('statusFilter').style.display = tab === 'reservations' ? '' : 'none';
  document.getElementById('searchInput').value = '';
  loadCurrentTab();
}

async function loadCurrentTab() {
  const host = document.getElementById('tableHost');
  host.innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    if (state.tab === 'reservations') await loadReservations();
    else if (state.tab === 'stores') { state.stores = await api('GET', '/api/admin/stores'); renderCurrentTab(); }
    else if (state.tab === 'owners') { state.owners = await api('GET', '/api/admin/owners'); renderCurrentTab(); }
    else if (state.tab === 'bookers') { state.bookers = await api('GET', '/api/admin/bookers'); renderCurrentTab(); }
  } catch (e) {
    host.innerHTML = `<div class="empty">불러오지 못했어요: ${e.message}</div>`;
  }
}

async function loadReservations() {
  const statusGroup = document.getElementById('statusFilter').value;
  state.reservations = await api('GET', `/api/admin/reservations${statusGroup ? '?statusGroup=' + statusGroup : ''}`);
  renderCurrentTab();
}

function matchesSearch(haystackParts, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return haystackParts.some(p => String(p ?? '').toLowerCase().includes(q));
}

function renderCurrentTab() {
  const query = document.getElementById('searchInput').value.trim();
  const host = document.getElementById('tableHost');
  const countEl = document.getElementById('rowCount');

  if (state.tab === 'reservations') {
    const rows = state.reservations.filter(r => matchesSearch([r.storeName, r.bookerName, r.eventPurpose], query));
    countEl.textContent = `${rows.length}건`;
    host.innerHTML = rows.length === 0 ? '<div class="empty">예약이 없어요</div>' : `<table>
      <thead><tr><th>매장</th><th>예약자</th><th>날짜/시간</th><th>인원</th><th>상태</th><th>액션</th></tr></thead>
      <tbody>${rows.map(reservationRow).join('')}</tbody>
    </table>`;
    return;
  }

  if (state.tab === 'stores') {
    const rows = state.stores.filter(s => matchesSearch([s.name, s.ownerName, s.region, s.category], query));
    countEl.textContent = `${rows.length}곳`;
    host.innerHTML = rows.length === 0 ? '<div class="empty">매장이 없어요</div>' : `<table>
      <thead><tr><th>매장명</th><th>카테고리</th><th>지역</th><th>점주</th><th>평점</th><th>최대인원</th><th>1인 가격</th><th>수락률</th></tr></thead>
      <tbody>${rows.map(storeRow).join('')}</tbody>
    </table>`;
    return;
  }

  if (state.tab === 'owners') {
    const rows = state.owners.filter(o => matchesSearch([o.storeName, o.ownerName, o.contact], query));
    countEl.textContent = `${rows.length}명`;
    host.innerHTML = rows.length === 0 ? '<div class="empty">점주가 없어요</div>' : `<table>
      <thead><tr><th>상호명</th><th>대표자</th><th>연락처</th><th>사업자번호</th><th>ownerId</th></tr></thead>
      <tbody>${rows.map(ownerRow).join('')}</tbody>
    </table>`;
    return;
  }

  if (state.tab === 'bookers') {
    const rows = state.bookers.filter(b => matchesSearch([b.realName, b.schoolName, b.schoolEmail, b.departmentName], query));
    countEl.textContent = `${rows.length}명`;
    host.innerHTML = rows.length === 0 ? '<div class="empty">예약자가 없어요</div>' : `<table>
      <thead><tr><th>이름</th><th>학교</th><th>학과/직책</th><th>학교 이메일</th><th>전화번호</th></tr></thead>
      <tbody>${rows.map(bookerRow).join('')}</tbody>
    </table>`;
    return;
  }
}

function statusLabel(status) {
  return { PENDING: '대기중', CONFIRMED: '확정', COMPLETED: '완료', CANCELLED: '취소', REJECTED: '거절' }[status] || status;
}

function reservationRow(r) {
  let actions = '';
  if (r.status === 'PENDING') {
    actions = `<button class="btn primary" onclick="setStatus('${r.id}','CONFIRMED')">승인</button>
               <button class="btn danger" onclick="setStatus('${r.id}','REJECTED')">거절</button>`;
  } else if (r.status === 'CONFIRMED') {
    actions = `<button class="btn" onclick="setStatus('${r.id}','COMPLETED')">완료 처리</button>
               <button class="btn danger" onclick="setStatus('${r.id}','CANCELLED')">취소</button>`;
  }
  return `<tr>
    <td>${r.storeName}</td>
    <td>${r.bookerName || '-'}<div class="muted">${r.bookerAffiliation || ''}</div></td>
    <td>${r.date} ${r.timeSlots.map(t => t.slice(0,5)).join(', ')}</td>
    <td>${r.people}명</td>
    <td><span class="badge ${r.status}">${statusLabel(r.status)}</span></td>
    <td><div class="row-actions">${actions}</div></td>
  </tr>`;
}

function storeRow(s) {
  return `<tr>
    <td>${s.name}</td>
    <td>${s.category}</td>
    <td>${s.region}</td>
    <td>${s.ownerName}</td>
    <td>★ ${s.rating.toFixed(1)} <span class="muted">(${s.reviewCount})</span></td>
    <td>${s.maxCapacity}명</td>
    <td>${s.pricePerPerson.toLocaleString()}원</td>
    <td>${s.acceptanceRate}%</td>
  </tr>`;
}

function ownerRow(o) {
  return `<tr>
    <td>${o.storeName}</td>
    <td>${o.ownerName}</td>
    <td>${o.contact}</td>
    <td>${o.businessNumber}</td>
    <td class="mono">${o.id}</td>
  </tr>`;
}

function bookerRow(b) {
  return `<tr>
    <td>${b.realName}</td>
    <td>${b.schoolName}</td>
    <td>${b.departmentName} · ${b.position}</td>
    <td>${b.schoolEmail}</td>
    <td>${b.phoneNumber}</td>
  </tr>`;
}

async function setStatus(reservationId, status) {
  try {
    await api('POST', `/api/admin/reservations/${reservationId}/status?status=${status}`);
    await loadReservations();
    await loadStats();
  } catch (e) {
    alert('상태 변경 실패: ' + e.message);
  }
}

async function refreshAll() {
  await checkHealth();
  await loadStats();
  await loadCurrentTab();
}

refreshAll();
</script>
</body>
</html>
