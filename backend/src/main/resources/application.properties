spring.application.name=connect-grs-backend
server.port=8080

# Gmail SMTP로 회원가입 인증 메일 발송. 계정/비밀번호는 코드에 넣지 않고
# 환경변수(SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD - Gmail 앱 비밀번호)로 주입.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
